database:
    type: sqlite
    sqlite:
        path: data/app.db
app:
    name: Ant Browser
    window:
        width: 1750
        height: 1000
        min_width: 1200
        min_height: 700
    max_profile_limit: 999
    used_cd_keys: []
runtime:
    max_memory_mb: 0
    gc_percent: 100
logging:
    level: info
    file_enabled: false
    file_path: data/logs/app.log
    format: text
    buffer_size: 4
    async_queue_size: 1000
    flush_interval_ms: 1000
    rotation:
        enabled: false
        max_size_mb: 100
        max_age: 7
        max_backups: 5
        time_interval: daily
    interceptor:
        enabled: true
        log_parameters: true
        log_results: true
        sensitive_fields:
            - password
            - token
            - secret
browser:
    user_data_root: data
    default_fingerprint_args:
        - --fingerprint-brand=Chrome
        - --fingerprint-platform=windows
    default_launch_args:
        - --disable-sync
        - --no-first-run
    default_start_urls:
        - https://testrecaptcha.github.io/
        - https://abrahamjuliot.github.io/creepjs/
    restore_last_session: true
    start_ready_timeout_ms: 3000
    start_stable_window_ms: 1200
    cores:
        - core_id: 4f4c2f73-0d46-466e-838b-ebd34fb9ee86
          core_name: chromium-144.0.7559.132
          core_path: chrome\chromium-144.0.7559.132
          is_default: true
        - core_id: d0e3249d-7aa4-4492-a5f6-f0276ceceb8c
          core_name: chromium-142.0.7444.175
          core_path: chrome\chromium-142.0.7444.175
          is_default: false
        - core_id: core-cloakbrowser-146.0.7680.177.4
          core_name: Chrome cloakbrowser-146.0.7680.177.4
          core_path: chrome\cloakbrowser-146.0.7680.177.4
          is_default: false
